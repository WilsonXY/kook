name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Skill structure
        run: python3 scripts/doctor.py
      - name: Doctor tests
        run: python3 -m unittest scripts/test_doctor.py
      - name: Sync tests
        run: scripts/test-sync-skills.sh
      - name: Thread reader tests
        run: scripts/test-t3-thread.sh
      - name: Eval runner tests (stub agents, no model calls)
        run: scripts/test-eval.sh
      - name: Shellcheck (pinned; same binary as local runs, see AGENTS.md)
        env:
          SC_VERSION: v0.11.0
          SC_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSL -o sc.tar.xz "https://github.com/koalaman/shellcheck/releases/download/$SC_VERSION/shellcheck-$SC_VERSION.linux.x86_64.tar.xz"
          echo "$SC_SHA256  sc.tar.xz" | sha256sum -c -   # the checksum pins the exact binary
          tar -xJf sc.tar.xz
          "./shellcheck-$SC_VERSION/shellcheck" scripts/*.sh
      - name: Changelog line added
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx CHANGELOG.md \
            || { echo "::error::Add one line to CHANGELOG.md for this PR (see SCOPE.md)"; exit 1; }
